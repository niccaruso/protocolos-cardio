<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#185FA5;--blue-l:#E6F1FB;--green:#3B6D11;--green-l:#EAF3DE;
  --amber:#BA7517;--amber-l:#FAEEDA;--red:#A32D2D;--red-l:#FCEBEB;
  --gray:#5F5E5A;--gray-l:#F1EFE8;--border:#D5D3CC;--bg:#F7F6F2;
  --text:#1A1917;--text2:#5F5E5A;--text3:#888780;--white:#ffffff;--radius:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow-x:hidden;}
.app-header{background:var(--blue);padding:12px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.logo-area{display:flex;align-items:center;gap:10px;}
.logo-area img{height:30px;object-fit:contain;filter:brightness(0) invert(1);}
.logo-text{color:white;}
.logo-text .name{font-size:13px;font-weight:600;line-height:1.2;}
.logo-text .sub{font-size:10px;opacity:.75;}
.header-badge{background:rgba(255,255,255,.15);color:white;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap;}
.search-wrap{position:relative;}
.search-input{width:100%;background:rgba(255,255,255,.15);border:none;border-radius:var(--radius);padding:8px 12px 8px 34px;color:white;font-size:13px;outline:none;}
.search-input::placeholder{color:rgba(255,255,255,.6);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.7);font-size:15px;}
.nav-tabs{display:flex;overflow-x:auto;background:var(--white);border-bottom:1px solid var(--border);padding:0 4px;scrollbar-width:none;position:sticky;top:88px;z-index:99;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{flex-shrink:0;padding:10px 12px;font-size:12px;font-weight:500;color:var(--text2);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.nav-tab .ti{font-size:14px;}
.content{padding:12px;}
.section-header{margin-bottom:12px;}
.section-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:2px;}
.section-desc{font-size:12px;color:var(--text3);}
.section-source{display:inline-block;background:var(--green-l);color:var(--green);font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:4px;}
.proto-card{background:var(--white);border-radius:var(--radius);border:0.5px solid var(--border);margin-bottom:10px;overflow:hidden;}
.proto-card-header{padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer;}
.proto-card-header:active{background:var(--bg);}
.proto-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;}
.proto-cat{font-size:10px;color:var(--text3);margin-top:2px;}
.proto-chevron{font-size:16px;color:var(--text3);flex-shrink:0;margin-top:2px;transition:transform .2s;}
.proto-chevron.open{transform:rotate(180deg);}
.proto-body{display:none;border-top:0.5px solid var(--border);}
.proto-body.open{display:block;}
.proto-tabs{display:flex;border-bottom:0.5px solid var(--border);background:var(--bg);}
.proto-tab{flex:1;padding:8px;text-align:center;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px;}
.proto-tab.active{color:var(--blue);border-bottom-color:var(--blue);background:var(--white);}
.flow{padding:12px;display:flex;flex-direction:column;align-items:center;gap:0;}
.fn{width:100%;}
.cap{border-radius:20px;padding:7px 16px;text-align:center;font-size:12px;font-weight:600;color:white;margin:0 auto;}
.cap-blue{background:var(--blue);}
.cap-green{background:var(--green);}
.box{background:var(--white);border:0.5px solid var(--border);border-radius:var(--radius);padding:9px 11px;}
.box.bl{border-left:3px solid var(--blue);}
.box.al{border-left:3px solid var(--amber);}
.box.rl{border-left:3px solid var(--red);}
.box-title{font-size:11px;font-weight:600;color:var(--text);margin-bottom:3px;}
.box-body{font-size:11px;color:var(--text2);line-height:1.5;}
.arr{display:flex;flex-direction:column;align-items:center;padding:2px 0;}
.arr-l{width:1px;height:11px;background:var(--border);}
.arr-h{font-size:8px;color:var(--text3);}
.tbl-wrap{overflow-x:auto;margin-top:2px;}
.nt2{width:100%;font-size:10.5px;border-collapse:collapse;min-width:280px;}
.nt2 th{background:var(--bg);font-weight:600;font-size:10px;color:var(--text2);text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);}
.nt2 td{padding:4px 6px;border-bottom:0.5px solid var(--border);vertical-align:top;color:var(--text);}
.nt2 tr:last-child td{border-bottom:none;}
.nt2 tr:nth-child(even) td{background:var(--bg);}
.al-r{background:var(--red-l);color:var(--red);border-radius:5px;padding:6px 9px;font-size:11px;margin-top:2px;}
.al-b{background:var(--blue-l);color:var(--blue);border-radius:5px;padding:6px 9px;font-size:11px;margin-top:2px;}
.al-a{background:var(--amber-l);color:var(--amber);border-radius:5px;padding:6px 9px;font-size:11px;margin-top:2px;}
.notes-body{padding:10px;display:flex;flex-direction:column;gap:7px;}
.note-card{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.note-header{padding:8px 11px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--bg);}
.note-header:active{background:var(--border);}
.note-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-right:7px;}
.note-name{font-size:11.5px;font-weight:600;color:var(--text);}
.note-sub{font-size:9.5px;color:var(--text3);}
.note-content{display:none;padding:9px 11px;border-top:0.5px solid var(--border);}
.note-content.open{display:block;}
.note-text{font-size:11px;color:var(--text2);line-height:1.6;}
.search-results{padding:12px;}
.search-result-item{background:var(--white);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 13px;margin-bottom:8px;cursor:pointer;}
.search-result-item:active{background:var(--bg);}
.sr-title{font-size:13px;font-weight:600;color:var(--text);}
.sr-section{font-size:10px;color:var(--blue);font-weight:500;margin-top:2px;}
.sr-preview{font-size:11px;color:var(--text3);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.empty{text-align:center;padding:40px 20px;color:var(--text3);}
.empty .ti{font-size:36px;display:block;margin-bottom:8px;}
</style>

m</td></tr><tr><td>Output</td><td>Doble del umbral (mín 10 mA)</td></tr></table><div class='al-r'>No retirar cables sin indicación del cirujano.</div>"}, {"dot": "#3B6D11", "name": "Normotermia activa", "sub": "Por qué no extubar con T° &lt; 36°C", "body": "<div class='note-text'>El tiriteo aumenta VO₂ hasta 300–400%. No iniciar destete ventilatorio con T° &lt; 36°C.</div><table class='nt2'><tr><th>T°</th><th>Acción</th></tr><tr><td>&lt; 35°C</td><td>Calefactor de aire, líquidos calientes</td></tr><tr><td>35–36°C</td><td>Manta térmica, corregir K⁺ y Mg²⁺</td></tr><tr><td>≥ 36°C</td><td>Mantener. Evitar &gt; 38°C.</td></tr></table>"}], "alert": ["Nunca interrumpir infusiones de vasopresores al trasladar.", "r"]}, {"title": "Síndrome de bajo gasto cardíaco", "cat": "Complicación hemodinámica · Urgente", "pasos": [["Criterios diagnósticos (≥ 1)", "IC &lt; 2.2 L/min/m² · PAS &lt; 90 mmHg · lactato &gt; 2 mmol/L · oliguria &lt; 0.5 ml/kg/h × 2 h · SvO₂ &lt; 65%"], ["Identificar causa (eco urgente)", "Hipovolemia (PVC baja) · Taponamiento (derrame + colapso AD/VD) · Disfunción VI (FEVI baja) · Vasoplejía (RVS bajas)"], ["Tratamiento según patrón", "Hipovolemia: SF 250 ml en 15 min · Disfunción VI: dobutamina 2.5–10 + NE si PAM &lt; 65 · Taponamiento: pericardiocentesis urgente"], ["Escalada si no responde en 2 h", "BCIA → Impella (shock refractario) → ECMO V-A (colapso)"]], "tabla": {"headers": ["Fármaco", "Indicación", "Dosis"], "rows": [["Dobutamina", "Disfunción VI, bajo gasto", "2.5–20 mcg/kg/min"], ["Norepinefrina", "Vasoplejía, PAM baja", "0.05–0.5 mcg/kg/min"], ["Milrinona", "IC refractaria, HTP", "0.375–0.75 mcg/kg/min"], ["Levosimendan", "BB crónico, disfunción refractaria", "0.05–0.2 mcg/kg/min"], ["Adrenalina", "Shock refractario (rescate)", "0.05–0.5 mcg/kg/min"]]}, "notas": [{"dot": "#A32D2D", "name": "Clasificación SCAI", "sub": "Estadificación para guiar intensidad", "body": "<table class='nt2'><tr><th>Estadio</th><th>Descripción</th><th>Mortalidad</th></tr ta", "Llamar: cirugía cardiovascular + anestesia + perfusionista · RCP · Desfibrilación si FV/TV: 150–200 J"], ["FV/TV sin pulso", "Hasta 3 descargas consecutivas → amiodarona 300 mg IV → RCP 2 min entre descargas"], ["Asistolia/AESP", "Taponamiento → resternotomía · Hipovolemia → volumen · Marcapasos → verificar umbrales"], ["Sin respuesta en 5 min", "Resternotomía de emergencia. Masaje cardíaco interno más efectivo post-esternotomía."]], "tabla": {"headers": ["Causa reversible", "Clave diagnóstica", "Tratamiento"], "rows": [["Taponamiento", "AESP + PVC alta + sin pulso", "Resternotomía de emergencia"], ["Hipovolemia", "AESP + PVC baja", "Volumen IV rápido"], ["Neumotórax a tensión", "Asimetría ventilatoria", "Punción descompresiva"], ["Falla de marcapasos", "Asistolia con cables", "Aumentar output, modo asincrónico"]]}, "notas": [], "alert": ["Taponamiento sospechado: resternotomía sin esperar confirmación eco si el paciente no tolera la demora.", "r"]}, {"title": "Lesión renal aguda post-CCV (KDIGO)", "cat": "Complicación sistémica · Frecuente", "pasos": [["Estadificación KDIGO", "E1: Cr ×1.5 o +0.3 mg/dL en 48 h · E2: Cr ×2 · E3: Cr ×3 o &gt; 4 mg/dL"], ["Medidas nefroprotectoras", "Optimizar volemia y GC · suspender nefrotóxicos (AINE, IECA, contraste) · evitar hipotensión e hiperglucemia"], ["Furosemida en IRA", "Solo en sobrecarga hídrica sintomática. NO para revertir IRA ni como diurético preventivo."], ["Indicaciones de diálisis", "Hiperpotasemia refractaria · acidosis grave · sobrecarga hídrica con oligoanuria → consulta nefrología"]], "tabla": {"headers": ["Estadio KDIGO", "Criterio Cr", "Criterio diuresis"], "rows": [["1", "×1.5 o +0.3 mg/dL en 48 h", "&lt; 0.5 ml/kg/h × 6 h"], ["2", "×2", "&lt; 0.5 ml/kg/h × 12 h"], ["3", "×3 o &gt; 4 mg/dL", "&lt; 0.3 ml/kg/h × 24 h"]]}, "notas": [], "alert": ["Tiempo de CEC &gt; 120 min, bajo gasto postoperatorio y creatinina basal elevada son los principales factores de riesgo.", "a"]}, {"title": "Control de glucemia ": "IC con FEVI preservada (HFpEF / HFmrEF)", "cat": "Crónico · Piso / Ambulatorio", "pasos": [["Confirmar diagnóstico", "Síntomas de IC + FEVI ≥ 50% (HFpEF) o 41–49% (HFmrEF) + E/e&apos; &gt; 15 o BNP &gt; 35 pg/mL"], ["Tratamiento principal: comorbilidades", "HTA · Obesidad · FA · DM2 · ERC · Apnea del sueño · Anemia. Son el tratamiento con mayor impacto."], ["Farmacológico con evidencia", "iSGLT2 (Clase I en HFmrEF, IIa en HFpEF) · Diuréticos: solo control de congestión · ARM (Clase IIb) · ARNI (Clase IIb en HFmrEF)"], ["BB en HFpEF", "Sin beneficio demostrado salvo FA con RV rápida o HTA. No indicar de rutina."]], "tabla": {"headers": ["Intervención", "HFpEF (≥50%)", "HFmrEF (41–49%)"], "rows": [["iSGLT2", "Clase IIa (EMPEROR-Preserved)", "Clase I"], ["ARNI", "Clase IIb", "Clase IIb"], ["ARM", "Clase IIb", "Clase IIb"], ["Betabloqueante", "Solo FA o HTA", "Considerar"], ["Diuréticos", "Control congestión (sintomático)", "Control congestión"]]}, "notas": [], "alert": ["HFmrEF puede evolucionar a HFrEF o HFpEF. Requiere seguimiento con ecocardiograma periódico.", "a"]}, {"title": "Hiponatremia en IC", "cat": "Complicación · UCO / Piso", "pasos": [["Clasificación", "Leve: Na 130–134 · Moderada: 125–129 · Severa: &lt;125. Sintomática si: confusión, convulsión o deterioro agudo."], ["Na⁺ &lt; 125 o síntomas neurológicos", "Corrección activa cuidadosa. Objetivo: +5–8 mEq/L en 24 h. NUNCA superar +10–12 mEq/día (riesgo de mielinólisis pontina)."], ["Manejo conservador (leve-moderada)", "Restricción hídrica 1–1.5 L/día · suspender tiazida · tolvaptán si refractaria (15 mg/día VO, solo en hospital)"], ["Hipercorrección", "Si Na⁺ sube más rápido: dextrosa 5% para relentizar. La hipercorrección es tan peligrosa como la hiponatremia."]], "tabla": {"headers": ["Situación", "Límite de corrección"], "rows": [["Aguda (&lt;48h) sintomática", "+5 mEq/L en 1h, luego lento"], ["Crónica o desconocida", "Máx +8 mEq/L en 24h · +18 mEq en 48h"], ["Alto riesgo (desnutrición, alcoholismo)", "Máx +6 mEq/L en 24h"]]}, "notas": [], "alert": ["Tolvaptán: inicio solo en hospital con monitoreo de Na⁺ c/6h las primeras 24h. Máx 30 días consecutivos (hepatotoxicidad).", "a"]}, {"title": "Criterios de internación y alta en IC", "cat": "Gestión clínica · Guardia / Piso", "pasos": [["Internación en UCO (criterios mayores)", "SpO₂ &lt;90% · PAS &lt;90 mmHg · Arritmia inestable · EAP o insuf. resp. aguda · Cr sube &gt;0.5 mg/dL en 24 h"], ["Internación en piso (criterios menores)", "Congestión sin compromiso respiratorio · Diurético IV necesario · 1ª descompensación · Baja adherencia o sin seguimiento"], ["Alta segura", "Euvolémico · SpO₂ ≥94% sin O₂ · PAS ≥90 estable · diurético oral efectivo · Cr estable · cuádruple terapia iniciada · turno en 7–14 días PROGRAMADO"], ["Educación al alta", "Pesar diario (consultar si sube &gt;2 kg en 2 días) · restricción hídrica · sin sal · no suspender medicación · signos de alarma"]], "tabla": {"headers": ["Factor de riesgo readmisión 30 días", "Intervención"], "rows": [["Alta con congestión residual", "Ajustar diurético antes del alta"], ["Sin seguimiento programado", "Turno en 7 días obligatorio"], ["BNP al alta &gt;700 pg/mL", "Control en 48–72 h post-alta"], ["Insuficiencia renal", "Ionograma en 48 h post-alta"], ["Vive solo / baja adherencia", "Contacto telefónico en 48 h"]]}, "notas": [], "alert": ["La readmisión a 30 días es el principal indicador de calidad en IC. Un alta bien planificada vale más que días adicionales de internación.", "b"]}]}, {"id": "hemod", "shortTitle": "Hemo", "title": "Hemodinamia", "desc": "Cateterismo, intervencionismo coronario y procedimientos valvulares percutáneos", "source": "ACC/AHA 2023 · ESC 2023", "protos": [{"title": "Preparación para cateterismo cardíaco", "cat": "Preprocedimiento", "pasos": [["Evaluación pre-procedimiento", "Consentimiento firmado · Labs (hemograma, coagulograma, Cr, ionograma) · ECG reciente · Peso actual · Alergias al contraste (PREGUNTAR SIEMPRE)"], ["Medicaci  "cat": "Transversal · FA crónica", "pasos": [["Calcular CHA₂DS₂-VASc", "IC/FEVI baja=1 · HTA=1 · Edad ≥75=2 · DM=1 · ACV/AIT=2 · Enf. vascular=1 · Edad 65–74=1 · Sexo femenino=1"], ["Indicación de ACO", "H ≥2 pts: ACO indicado · M ≥3 pts: ACO indicado · H=0 / M=1: no ACO (no reemplazar con AAS)"], ["Elección del ACOD", "Apixabán (mejor perfil de sangrado): 5 mg c/12h · Rivaroxabán: 20 mg/día con cena · Dabigatrán: 150 mg c/12h (antídoto disponible)"], ["FA valvular o válvula mecánica", "Warfarina exclusivamente. RIN 2–3 (válvula biológica / FA valvular) o 2.5–3.5 (válvula mecánica mitral)."]], "tabla": {"headers": ["ACOD", "Dosis estándar", "Reducir dosis si", "Antídoto"], "rows": [["Apixabán", "5 mg c/12h", "2/3 de: edad ≥80, peso ≤60 kg, Cr ≥1.5", "Andexanet"], ["Rivaroxabán", "20 mg/día (con cena)", "TFG 15–49: 15 mg/día", "CCP 4-factor"], ["Dabigatrán", "150 mg c/12h", "TFG 30–50: 110 mg c/12h. Evitar si &lt;30", "Idarucizumab 5 g IV"]]}, "notas": [], "alert": ["Periprocedimiento: no es necesario puente con HBPM en la mayoría de los casos (BRIDGE trial).", "b"]}]}, {"id": "ecmo", "shortTitle": "ECMO", "title": "ECMO — Oxigenación por Membrana Extracorpórea", "desc": "Indicaciones, traslado externo, inicio, manejo diario, destete y complicaciones", "source": "ELSO 2021 · ESC 2023 · EACTS", "protos": [{"title": "Indicaciones y contraindicaciones", "cat": "Decisión · Multidisciplinaria", "pasos": [["Indicaciones ECMO V-A (cardíaco)", "Shock cardiogénico refractario (SCAI D–E) · PCR refractaria con causa reversible (E-CPR) · Falla primaria del injerto post-trasplante · Miocarditis fulminante · Intoxicación cardiodepresora grave"], ["Indicaciones ECMO V-V (respiratorio)", "SDRA severo: PaO₂/FiO₂ &lt;80 con FiO₂ 1.0 y PEEP ≥10 × 6 h · pH &lt;7.20 con PaCO₂ &gt;80 no corregible con VM"], ["Contraindicaciones absolutas", "Daño neurológico irreversible severo · Enfermedad terminal sin opción de puente · Decisión de LET documentada"], ["Contraindicaciones relativas", "Ed ón distal (arteria femoral superficial ipsilateral, 6–8 Fr) en el mismo acto. Previene isquemia aguda de miembro.", "r"]}, {"title": "Inicio y configuración del ECMO V-A", "cat": "Técnico · UCI", "pasos": [["Parámetros de inicio", "Flujo inicial 1.5–2 L/min → escalar a 2.5–3.5 L/min · FiO₂ del gas 1.0 al inicio · Sweep gas = flujo de sangre · Normotermia 36–37°C"], ["Objetivos primeras horas", "PAM 65–75 mmHg · Flujo ≥2.5 L/min/m² · SvO₂ circuito ≥65% · Lactato: descenso ≥10%/2h · Diuresis ≥0.5 ml/kg/h · Hb ≥10 g/dL"], ["Anticoagulación", "HNF IV: ACT 180–220 s primeras 4 h → APTT 60–80 s. Sin ACO aceptable las primeras 6–12 h si sangrado activo post-CCV."], ["VI no eyecta (línea arterial plana)", "Eco urgente: si VI dilatado → venting (Impella 1ª elección) para prevenir distensión y edema pulmonar refractario."]], "tabla": {"headers": ["Síndrome", "Diagnóstico", "Solución"], "rows": [["Distensión del VI", "VI dilatado + VaAo no abre + edema pulmonar pese a buen flujo", "Venting: Impella · BCIA · drenaje quirúrgico AI"], ["Síndrome de Arlequín", "SpO₂ mano derecha &lt; SpO₂ pie · NIRS cerebral bajo", "Cánula retorno en yugular (config. V-AV) · Mejorar ventilación"]]}, "notas": [], "alert": ["MONITORIZAR SpO₂ en la mano DERECHA (preductal) en todo ECMO V-A femoro-femoral. Valor bajo indica Síndrome de Arlequín.", "r"]}, {"title": "Manejo diario del paciente en ECMO", "cat": "UCI · Checklist diario", "pasos": [["A — Circuito", "Flujo · RPM · presiones · inspección visual de coágulos · oxigenador: si ΔpO₂ cae &gt;50 mmHg: considerar cambio"], ["B — Anticoagulación", "APTT c/6 h (objetivo 60–80 s) · fibrinógeno c/24 h · plaquetas c/12–24 h · LDH y haptoglobina c/24 h (hemólisis)"], ["C — Hemodinámica y recuperación", "Pulsatilidad en línea arterial (señal de recuperación) · Eco diario: FEVI, apertura VaAo · Lactato c/6–12 h · SvO₂ circuito"], ["D — Miembro inferior", "Pulso distal c/4–6 h · temperatura y color del pie · cánula de perfusión distal: flujo visible, sin aco =1 · PAS &lt;100=1 · SpO₂ &lt;90%=1 · Score 0: bajo riesgo, ambulatorio posible. Score ≥1: internar."], ["Anticoagulación: inicio y duración", "Anticoagular al sospechar si probabilidad alta (antes de confirmación). TVP proximal o TEP: mínimo 3 meses. Recurrente / trombofilia / neoplasia: indefinida."]], "tabla": {"headers": ["Situación", "Profilaxis de TVP"], "rows": [["Internación médica sin ACO terapéutica", "Enoxaparina 40 mg SC/día"], ["TFG 15–30", "Enoxaparina 20 mg SC/día o HNF 5000 U SC c/12h"], ["TFG &lt;15 o diálisis", "HNF 5000 U SC c/8–12h"], ["Ya con ACO terapéutica", "No agregar profilaxis"]]}, "notas": [], "alert": ["Movilización el mismo día: el mejor complemento a la profilaxis farmacológica para prevención de TVP.", "b"]}, {"title": "Nutrición en el paciente cardíaco crítico", "cat": "UCO · CCV · ECMO", "pasos": [["Cribado nutricional (NRS 2002)", "IMC &lt;20.5 · pérdida de peso reciente · ingesta reducida · paciente crítico. Score ≥3: soporte activo. En ARM &gt;48 h: siempre."], ["Vía oral posible", "Dieta cardioprotectora: sal &lt;2 g/día (IC), restricción hídrica si hiponatremia, fraccionada, suplementos proteicos si ingesta &lt;60%."], ["No tolera VO / intubado", "Nutrición enteral precoz en 24–48 h. Iniciar 20 ml/h → progresar c/8h. Objetivo: 25–30 kcal/kg/día. Shock: esperar PAM ≥65 estable."], ["Síndrome de realimentación", "Riesgo: IMC &lt;16, ayuno &gt;5 días, alcoholismo. Iniciar al 25% del objetivo calórico. Tiamina 200 mg IV antes de glucosa. Controlar fosfato, K y Mg c/12–24 h."]], "tabla": {"headers": ["Situación", "Consideración especial"], "rows": [["IC con congestión", "Fórmulas concentradas (1.5–2 kcal/ml) · reducir volumen · restricción sódica"], ["PostCCV primeras 48 h", "Inicio enteral precoz si extubado. No esperar tránsito."], ["ECMO", "Enteral precoz incluso en ECMO V-A si tolera. Proteger mucosa intestinal."], ["Shock cardiogénico", "Esperar PAM ≥65 estable. Si NE &gt;0.3: parenteral transitoria."]]}, "notas": [], "alert": . ATC primaria &lt;120 min. AAS 300 mg + ticagrelor 180 mg + HNF 70–100 U/kg IV. AVISAR HEMODINAMIA AHORA."], ["Sin elevación del ST: algoritmo 0/1h de TnUs", "TnUs basal baja + delta &lt;3 ng/L → Rule-out · TnUs alta O delta &gt;6 ng/L → Rule-in (UCO urgente) · Zona gris: TnUs 3–6 h"], ["Disección aórtica — no olvidarla", "Dolor desgarrante + diferencia PA entre brazos + mediastino ensanchado. NO ANTICOAGULAR. Angio-TC aorta urgente. Avisar cirugía inmediatamente."]], "tabla": {"headers": ["Diagnóstico diferencial", "Clave de sospecha", "Acción urgente"], "rows": [["SCACEST", "Elevación ST o BRIHH nuevo", "Código infarto. ATC primaria."], ["Disección aórtica", "Dolor desgarrante + diferencia PA entre brazos", "NO anticoagular. Angio-TC aorta."], ["TEP masivo", "Hipoxemia + inestabilidad + VD dilatado en eco", "Trombolisis si sin contraindicaciones"], ["Neumotórax a tensión", "Asimetría torácica + hipoxemia aguda", "Punción descompresiva urgente"]]}, "notas": [], "alert": ["Umbrales del algoritmo 0/1h dependen del ensayo de TnUs disponible (Elecsys, ADVIA, etc.). Usar los valores validados para el laboratorio del servicio.", "a"]}]}];
let currentSection=0,openProtocols={},openNotes={},protoTabs={};

const ICONS={ccv:'ti-heart-rate-monitor',ic:'ti-activity',hemod:'ti-stethoscope',
             arritmias:'ti-bolt',ecmo:'ti-device-heart-monitor',transversal:'ti-clipboard-list'};

function buildNav(){
  const nav=document.getElementById('navTabs');
  SECTIONS.forEach((s,i)=>{
    const t=document.createElement('div');
    t.className='nav-tab'+(i===0?' active':'');
    t.innerHTML=`<i class="ti ${ICONS[s.id]||'ti-file'}"></i>${s.shortTitle}`;
    t.onclick=()=>selectSection(i);
    nav.appendChild(t);
  });
}

function selectSection(i){
  currentSection=i;
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.nav-tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  renderSection(i);
}

function renderSection(i){
  const s=SECTIONS[i];
  let h=`<div class="content">
    <div class="section-header">
      <div class="section-title">${s.title}</div>
      <div class="section-desc">${s.desc}</div>
      <span class="section-source">${s.source}</span>
    </div>`;
  s.protos.forEach((p,pi)=>{
    const key=`${i}-${pi}`;
    const open=openProtocols[key];
    const ptab=protoTabs[key]||'flow';
    h+=`<div class="proto-card">
      <div class="proto-card-header" onclick="toggleProto('${key}')">
        <div><div class="proto-title">${p.title}</div><div class="proto-cat">${p.cat}</div></div>
        <i class="ti ti-chevron-down proto-chevron ${open?'open':''}"></i>
      </div>
      <div class="proto-body ${open?'open':''}">
        <div class="proto-tabs">
          <div class="proto-tab ${ptab==='flow'?'active':''}" onclick="setProtoTab('${key}','flow',event)">
            <i class="ti ti-sitemap"></i>Flujograma
          </div>
          <div class="proto-tab ${ptab==='notas'?'active':''}" onclick="setProtoTab('${key}','notas',event)">
            <i class="ti ti-notes"></i>Notas
          </div>
        </div>
        <div id="ptbody-${key}">${ptab==='flow'?renderFlow(p):renderNotas(p,key)}</div>
      </div>
    </div>`;
  });
  h+='</div>';
  document.getElementById('mainContent').innerHTML=h;
}

function renderFlow(p){
  let h='<div class="flow">';
  h+=`<div class="fn"><div class="cap cap-blue">${p.title}</div></div>`;
  p.pasos.forEach(([title,body])=>{
    h+='<div class="arr"><div class="arr-l"></div><div class="arr-h">▼</div></div>';
    h+=`<div class="fn"><div class="box bl"><div class="box-title">${title}</div><div class="box-body">${body}</div></div></div>`;
  });
  if(p.tabla){
    const hdrs = p.tabla.headers || p.tabla.h || [];
    const rows = p.tabla.rows   || p.tabla.r || [];
    h+='<div class="arr"><div class="arr-l"></div><div class="arr-h">▼</div></div>';
    h+=`<div class="fn"><div class="box al"><div class="box-title">Referencia rápida</div>
      <div class="tbl-wrap"><table class="nt2">
        <tr>${hdrs.map(hd=>`<th>${hd}</th>`).join('')}</tr>
        ${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
      </table></div></div></div>`;
  }
  if(p.alert&&p.alert[0]){
    const cls={r:'al-r',b:'al-b',a:'al-a'}[p.alert[1]]||'al-a';
    h+=`<div class="arr"><div class="arr-l"></div><div class="arr-h">▼</div></div>`;
    h+=`<div class="fn"><div class="${cls}">⚠ ${p.alert[0]}</div></div>`;
  }
  h+='</div>';
  return h;
}

function renderNotas(p,key){
  if(!p.notas||!p.notas.length) return '<div class="empty"><i class="ti ti-notes"></i><br>Sin notas adicionales</div>';
  let h='<div class="notes-body">';
  p.notas.forEach((n,ni)=>{
    const nkey=`${key}-${ni}`;
    const open=openNotes[nkey];
    h+=`<div class="note-card">
      <div class="note-header" onclick="toggleNote('${nkey}')">
        <div style="display:flex;align-items:center;">
          <div class="note-dot" style="background:${n.dot}"></div>
          <div><div class="note-name">${n.name}</div><div class="note-sub">${n.sub}</div></div>
        </div>
        <i class="ti ti-chevron-down" style="font-size:13px;color:var(--text3)"></i>
      </div>
      <div class="note-content ${open?'open':''}" id="nc-${nkey}">${n.body}</div>
    </div>`;
  });
  return h+'</div>';
}

function toggleProto(key){
  openProtocols[key]=!openProtocols[key];
  renderSection(currentSection);
  setTimeout(()=>{
    const cards=document.querySelectorAll('.proto-card');
    const idx=parseInt(key.split('-')[1]);
    if(openProtocols[key]&&cards[idx]) cards[idx].scrollIntoView({behavior:'smooth',block:'nearest'});
  },50);
}

function setProtoTab(key,tab,e){
  e.stopPropagation();
  protoTabs[key]=tab;
  openProtocols[key]=true;
  const body=document.getElementById('ptbody-'+key);
  if(!body)return;
  const[si,pi]=key.split('-').map(Number);
  const p=SECTIONS[si].protos[pi];
  body.innerHTML=tab==='flow'?renderFlow(p):renderNotas(p,key);
  body.closest('.proto-body').querySelectorAll('.proto-tab').forEach(t=>{
    const isFlow=t.textContent.includes('Flujograma');
    t.classList.toggle('active',(tab==='flow')===isFlow);
  });
}

function toggleNote(nkey){
  openNotes[nkey]=!openNotes[nkey];
  const el=document.getElementById('nc-'+nkey);
  if(el)el.classList.toggle('open',openNotes[nkey]);
}

function doSearch(q){
  const mc=document.getElementById('mainContent');
  if(!q.trim()){renderSection(currentSection);return;}
  const ql=q.toLowerCase();
  const results=[];
  SECTIONS.forEach((s,si)=>{
    s.protos.forEach((p,pi)=>{
      const hay=(p.title+' '+p.cat+' '+p.pasos.map(x=>x.join(' ')).join(' ')).toLowerCase();
      if(hay.includes(ql))results.push({si,pi,s,p});
    });
  });
  if(!results.length){
    mc.innerHTML=`<div class="empty"><i class="ti ti-search"></i><br>Sin resultados para "${q}"</div>`;
    return;
  }
  let h=`<div class="search-results"><div style="font-size:11px;color:var(--text3);margin-bottom:8px;">${results.length} resultado${results.length>1?'s':''}</div>`;
  results.forEach(({si,pi,s,p})=>{
    const preview=p.pasos[0]?p.pasos[0][1].replace(/<[^>]+>/g,'').substring(0,80)+'…':'';
    h+=`<div class="search-result-item" onclick="goToProto(${si},${pi})">
      <div class="sr-title">${p.title}</div>
      <div class="sr-section">${s.title}</div>
      <div class="sr-preview">${preview}</div>
    </div>`;
  });
  mc.innerHTML=h+'</div>';
}

function goToProto(si,pi){
  document.getElementById('searchInput').value='';
  currentSection=si;
  document.querySelectorAll('.nav-tab').forEach((t,j)=>t.classList.toggle('active',j===si));
  const key=`${si}-${pi}`;
  openProtocols[key]=true;
  renderSection(si);
  setTimeout(()=>{
    const cards=document.querySelectorAll('.proto-card');
    if(cards[pi])cards[pi].scrollIntoView({behavior:'smooth',block:'start'});
  },100);
}

buildNav();
renderSection(0);
</script>
</body>
</html>
